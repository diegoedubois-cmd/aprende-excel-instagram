name: Comprobar publicador
on:
  push:
    paths:
      - 'publisher/**'
      - 'tests/**'
      - '.github/workflows/comprobar-publicador.yml'
  pull_request:
    paths:
      - 'publisher/**'
      - 'tests/**'
      - '.github/workflows/comprobar-publicador.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
