name: Informe semanal
on:
  schedule:
    - cron: "17 8 * * 1"   # lunes, 9:17 en España
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  informe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Métricas de la semana
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
        run: python publisher/informe.py >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar informe
        run: |
          git config user.name "publicador-instagram"
          git config user.email "actions@users.noreply.github.com"
          git add informes
          git diff --cached --quiet || (git commit -m "Informe semanal $(date -u +%F)" && git pull --rebase && git push)
