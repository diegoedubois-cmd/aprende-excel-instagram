name: Ensayo sin publicar
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Ids del calendario a ensayar (separados por comas); vacío = muestra estándar"
        required: false
jobs:
  ensayo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crear contenedores sin publicar
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main
          FB_PAGE_ID: "1391043200767851"
          ENSAYO_IDS: ${{ inputs.ids }}
        run: python publisher/validar.py
