name: Diagnóstico Meta sin enviar mensajes
on:
  push:
    paths:
      - 'publisher/diagnostico_comentarios.py'
      - '.github/workflows/diagnostico-meta.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar permisos y comentarios
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          FB_PAGE_ID: '1391043200767851'
        run: python publisher/diagnostico_comentarios.py
