name: Publicar en Instagram
on:
  schedule:
    - cron: "5 * * * *"   # cada hora, minuto 5 (UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular sin publicar"
        default: "false"
permissions:
  contents: write
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar lo que toca
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main
          FB_PAGE_ID: "1391043200767851"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python publisher/publish.py
      - name: Guardar estado
        if: always()
        run: |
          git config user.name "publicador-instagram"
          git config user.email "actions@users.noreply.github.com"
          git add state/published.json
          git diff --cached --quiet || (git commit -m "Estado de publicación $(date -u +%FT%RZ)" && git push)
